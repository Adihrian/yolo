apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolo-backend-deployment
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yolo-backend
  template:
    metadata:
      labels:
        app: yolo-backend
    spec:
      containers:
      - name: yolo-backend
        image: docker.io/adrianapindi/yolo-backend:v1.0.1
        ports:
        - containerPort: 5000
        env:
        - name: MONGO_URL
          value: "mongodb://mongo:27017/yolo-db"
